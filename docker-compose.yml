# Жергілікті немесе VPS-те толық жүйені іске қосу:
#   cp .env.example .env   (толтырыңыз)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talshyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env ішінде берілуі керек}
      POSTGRES_DB: talshyn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talshyn"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://talshyn:${POSTGRES_PASSWORD}@db:5432/talshyn
      DATABASE_URL_UNPOOLED: postgresql://talshyn:${POSTGRES_PASSWORD}@db:5432/talshyn
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
